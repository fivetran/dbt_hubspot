version: 1.10.2-a1
pr_number: 234
bug_fixes:
- description: Fixes a failure in `int_hubspot__deals_enhanced` when a deal's `owner_id`
    holds more than one owner ID separated by a semicolon (for example, `35252170;44023296`).
    On warehouses such as Snowflake, the owner join tried to cast this value to a
    number and failed, so `hubspot__deals` and `hubspot__deal_stages` didn't build.
    The join now compares owner IDs as strings and matches a multi-owner deal to its
    first owner ID. The `owner_id` column keeps its original value. See the DECISIONLOG
    for details.
date: '2026-11-24'
