version: 1.11.0
pr_number: 230
new_features:
- title: Breaking change
  description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_hubspot/issues/new/choose).
under_the_hood:
- description: Updates yml column documentation to match model output.
- description: Renames the `macro` CTE to `macro_columns` in staging models, because
    `macro` is a reserved keyword in the dbt Fusion static analysis parser for DuckDB.
- description: Casts the end of the date range in `int_hubspot__deal_calendar_spine`
    to a date so both sides of the comparison are dates. The output is unchanged.
date: '2026-11-18'
