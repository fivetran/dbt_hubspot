version: 2

models:

  - name: hubspot__daily_contact_history
    description: >
      Each record represents a contact's day in Hubspot with tracked properties pivoted into columns. By default, tracks the contact's
      lifecycle stage and owner on each day.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: contact_day_id
        description: Unique surrogate key hashed on `source_relation`, `date_day`, and `contact_id`.
        tests:
          - unique
          - not_null
      - name: date_day
        description: Date on which the contact had these values.
      - name: contact_id
        description: Unique id of a contact in Hubspot.
      - name: lifecyclestage
        description: The lifecycle stage of the contact on that day.
      - name: hubspot_owner_id
        description: The ID of the contact owner on that day.
      - name: owner_full_name
        description: The full name of the contact owner on that day.
      - name: owner_email_address
        description: The email address of the contact owner on that day.
      - name: count_engagement_notes
        description: Number of note engagements logged for the contact on that day. Requires `hubspot_sales_enabled`, `hubspot_engagement_enabled`, `hubspot_engagement_contact_enabled`, and `hubspot_engagement_note_enabled`.
      - name: count_engagement_tasks
        description: Number of task engagements logged for the contact on that day. Requires `hubspot_engagement_task_enabled`.
      - name: count_engagement_calls
        description: Number of call engagements logged for the contact on that day. Requires `hubspot_engagement_call_enabled`.
      - name: count_engagement_meetings
        description: Number of meeting engagements logged for the contact on that day. Requires `hubspot_engagement_meeting_enabled`.
      - name: count_engagement_emails
        description: Number of outbound email engagements logged for the contact on that day. Requires `hubspot_engagement_email_enabled`.
      - name: count_engagement_incoming_emails
        description: Number of inbound email engagements logged for the contact on that day. Requires `hubspot_engagement_email_enabled`.
      - name: count_engagement_forwarded_emails
        description: Number of forwarded email engagements logged for the contact on that day. Requires `hubspot_engagement_email_enabled`.
      - name: total_emails_sent
        description: Number of emails sent to the contact on that day. Requires `hubspot_email_event_enabled` and `hubspot_email_event_sent_enabled`.
      - name: total_email_deliveries
        description: Number of emails delivered to the contact on that day.
      - name: total_email_opens
        description: Number of email opens by the contact on that day.
      - name: total_email_clicks
        description: Number of email link clicks by the contact on that day.
      - name: total_email_bounces
        description: Number of email bounces for the contact on that day.
      - name: total_email_spam_reports
        description: Number of spam reports by the contact on that day.
      - name: total_email_unsubscribes
        description: Number of email unsubscribes by the contact on that day. Requires `hubspot_email_event_status_change_enabled`.

  - name: hubspot__contact_history
    description: Each record represents a change to contact record in Hubspot; the grain of this model is contact_id -> field_name -> valid_to.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"

      - name: _fivetran_synced
        description: '{{ doc("_fivetran_synced") }}'

      - name: change_source
        description: '{{ doc("history_source") }}'

      - name: change_source_id
        description: '{{ doc("history_source_id") }}'

      - name: valid_from
        description: The timestamp the change was valid from.

      - name: valid_to
        description: The timestamp the change was valid to. Null if still valid.

      - name: contact_id
        description: The ID of the related contact record.

      - name: field_name
        description: '{{ doc("history_name") }}'

      - name: new_value
        description: '{{ doc("history_value") }}'

      - name: id
        description: The ID of the change. Hashed on `source_relation`, `contact_id`, `field_name`, and `valid_from`.
        tests:
          - unique
          - not_null