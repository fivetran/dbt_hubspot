version: 2

models:
  - name: stg_hubspot__marketing_event
    description: Each record represents a marketing event in HubSpot.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: is_marketing_event_deleted
        description: '{{ doc("is_deleted") }}'
      - name: _fivetran_synced
        description: '{{ doc("_fivetran_synced") }}'
      - name: marketing_event_id
        description: The unique ID of the marketing event.
        tests:
          - not_null
      - name: app_id
        description: The string ID of the app associated with the marketing event.
      - name: app_name
        description: The name of the app associated with the marketing event.
      - name: attendees
        description: Number of attended contact records of a marketing event.
      - name: cancellations
        description: Number of cancelled contact records of a marketing event.
      - name: created_timestamp
        description: The timestamp when the marketing event was created.
      - name: end_timestamp
        description: The timestamp when the marketing event ends.
      - name: event_cancelled
        description: Boolean indicating whether the marketing event was cancelled.
      - name: event_completed
        description: Boolean indicating whether the marketing event has been completed.
      - name: event_description
        description: A description of the marketing event.
      - name: event_name
        description: The name of the marketing event.
      - name: event_organizer
        description: The name of the organizer of the marketing event.
      - name: event_status
        description: The current status of the marketing event.
      - name: event_type
        description: The type of marketing event.
      - name: event_url
        description: A URL in the external event application where the marketing event can be managed.
      - name: external_event_id
        description: The ID that is associated with this marketing event in the external event application.
      - name: no_shows
        description: Number of no-show contact records of a marketing event.
      - name: registrants
        description: Number of registered contact records of a marketing event.
      - name: start_timestamp
        description: The timestamp when the marketing event starts.
      - name: updated_timestamp
        description: The timestamp when the marketing event was last updated.

  - name: stg_hubspot__marketing_event_list
    description: Each record represents a list associated with a marketing event in HubSpot.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: '{{ doc("_fivetran_synced") }}'
      - name: marketing_event_list_id
        description: The unique ID of the marketing event list.
        tests:
          - not_null
      - name: marketing_event_id
        description: The ID of the related marketing event.
      - name: marketing_event_list_name
        description: The name of the marketing event list.
      - name: created_by_id
        description: The ID of the user who created the list.
      - name: updated_by_id
        description: The ID of the user who last updated the list.
      - name: filters_updated_at
        description: The timestamp when the list filters were last updated.
      - name: created_timestamp
        description: The timestamp when the list was created.
      - name: processing_status
        description: The current processing status of the list.
      - name: deleted_timestamp
        description: The timestamp when the list was deleted, if applicable.
      - name: list_version
        description: The version number of the list.
      - name: object_type_id
        description: The ID corresponding to the object type stored by the list.
      - name: size
        description: The number of records in the list.
      - name: updated_timestamp
        description: The timestamp when the list was last updated.

  - name: stg_hubspot__marketing_event_participant
    description: Each record represents a participant in a marketing event in HubSpot.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: '{{ doc("_fivetran_synced") }}'
      - name: marketing_event_participant_id
        description: The unique ID of the marketing event participant record.
        tests:
          - not_null
      - name: marketing_event_id
        description: The ID of the related marketing event.
      - name: contact_id
        description: The ID of the related contact.
      - name: created_timestamp
        description: The timestamp when the participant record was created.
      - name: occurred_timestamp
        description: The timestamp when the participation event occurred.
      - name: attendance_percentage
        description: Percentage of the participation duration relative to the event duration.
      - name: attendance_state
        description: The attendance state of the participant (e.g., ATTENDED, CANCELLED, EMPTY, NO_SHOW, REGISTERED).
      - name: attendance_duration_seconds
        description: The number of seconds the participation lasted.

  - name: stg_hubspot__marketing_event_custom_property
    description: Each record represents a custom property on a marketing event in HubSpot.
    columns:
      - name: source_relation
        description: "{{ doc('source_relation') }}"
      - name: _fivetran_synced
        description: '{{ doc("_fivetran_synced") }}'
      - name: marketing_event_id
        description: The ID of the related marketing event.
      - name: property_name
        description: The name of the custom property.
      - name: property_value
        description: The value of the custom property.
